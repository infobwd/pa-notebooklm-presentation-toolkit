name: Web UI checks

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "index.html"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "web/**"
      - "index.html"
      - ".github/workflows/web-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check web/js/reliability.js
          node --check web/js/migrations.js
          node --check web/js/document-audit.js
          node --check web/app.js

      - name: Run reliability tests
        run: |
          node web/tests/reliability.test.js
          node web/tests/document-audit.test.js

      - name: Verify required web files
        run: |
          test -f web/index.html
          test -f web/styles.css
          test -f web/app.js
          test -f web/js/reliability.js
          test -f web/js/migrations.js
          test -f web/tests/reliability.test.js
          test -f web/js/document-audit.js
          test -f web/tests/document-audit.test.js
          test -f web/schema/project.schema.json
          grep -q 'fonts.googleapis.com/css2?family=Kanit' web/index.html
          grep -q 'family=Sarabun' web/index.html
          grep -q 'readinessIndicatorList' web/index.html
          grep -q 'projectDashboardGrid' web/index.html
          grep -q 'sourceAuditList' web/index.html
          grep -q 'step3-source-tip' web/index.html
          grep -q 'data-pick-source-file' web/app.js
          grep -q 'data-use-as-source' web/app.js
          grep -q 'validateAiJsonBtn").click()' web/app.js
          if grep -q 'id="importAiJsonBtn"[^>]*disabled' web/index.html; then echo "Import button must stay clickable before validation"; exit 1; fi
          grep -q 'document-audit.js' web/index.html
          grep -q 'toastStack' web/index.html
          grep -q 'ACTUAL_MODES' web/app.js
          grep -q 'SMART_LIST_FIELDS' web/app.js
          grep -q 'function notify' web/app.js
          if grep -qE '\b(window\.)?alert\s*\(' web/app.js; then echo "window.alert is not allowed"; exit 1; fi
          grep -q 'data-fill-target="position"' web/index.html
          grep -q 'Phase 3.4 Guided Import & Source Picker' web/index.html
          grep -q 'openDocumentReaderBtn' web/index.html
          grep -q 'pdfjs-dist@3.11.174' web/app.js
          grep -q 'mammoth@1.8.0' web/app.js
          grep -q 'AI JSON Assistant' web/index.html
          grep -q 'pa-toolkit/intake/3.1' web/schema/ai-intake.schema.json
          grep -q 'PAToolkitReliability' web/app.js
          grep -q 'aiImportReview' web/index.html
          grep -q 'document-role' web/app.js
          grep -q 'FIELD_EXAMPLES' web/app.js
          test -f web/test-data/owner-pa-2569.ai-intake.json
          test -f web/test-data/owner-pa-2569.project.json
          grep -q 'loadOwnerTestDataBtn' web/index.html
          grep -q 'owner-pa-2569.ai-intake.json' web/app.js
