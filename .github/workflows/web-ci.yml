name: Web UI checks

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "index.html"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "web/**"
      - "index.html"
      - ".github/workflows/web-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: node --check web/app.js

      - name: Verify required web files
        run: |
          test -f web/index.html
          test -f web/styles.css
          test -f web/app.js
          grep -q 'fonts.googleapis.com/css2?family=Kanit' web/index.html
          grep -q 'data-fill-target="position"' web/index.html
          grep -q 'Phase 3 Local Document Reader' web/index.html
          grep -q 'openDocumentReaderBtn' web/index.html
          grep -q 'pdfjs-dist@3.11.174' web/app.js
          grep -q 'mammoth@1.8.0' web/app.js
          grep -q 'AI JSON Assistant' web/index.html
          grep -q 'pa-toolkit/intake/2.2' web/app.js
          grep -q 'FIELD_EXAMPLES' web/app.js
